name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'scripts/build_pages_report.py'
      - 'scripts/pages_runtime.py'
      - 'scripts/pages_insights.py'
      - 'scripts/pages_insights_full.py'
      - 'scripts/metrics.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      WEREAD_PAGES_INCLUDE_PRIVATE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build full real-data report
        run: python scripts/pages_runtime.py
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
