name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - 'scripts/build_pages_report.py'
      - 'scripts/pages_runtime.py'
      - 'scripts/pages_public_quotes.py'
      - 'scripts/pages_hidden_search_ui.py'
      - 'scripts/pages_polish_site.py'
      - 'scripts/pages_insights.py'
      - 'scripts/pages_insights_full.py'
      - 'scripts/pages_enrichment.py'
      - 'scripts/pages_enrich_site.py'
      - 'scripts/pages_story_ui.py'
      - 'scripts/pages_year_lens_ui.py'
      - 'scripts/pages_experience_ui.py'
      - 'scripts/pages_command_ui.py'
      - 'scripts/pages_queue_io_ui.py'
      - 'scripts/pages_theme_ui.py'
      - 'scripts/validate_pages_output.py'
      - 'scripts/metrics.py'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      WEREAD_PAGES_INCLUDE_PRIVATE: '1'
      WEREAD_PAGES_INCLUDE_PUBLIC_QUOTES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Build full real-data report
        run: |
          python scripts/pages_runtime.py
          python scripts/pages_public_quotes.py
          python scripts/pages_polish_site.py
      - name: Validate final Page contract and JS
        run: |
          python scripts/validate_pages_output.py --js-out /tmp/we-read-pages-inline.js
          node --check /tmp/we-read-pages-inline.js
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
